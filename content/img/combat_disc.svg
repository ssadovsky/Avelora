<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Золотой металлический градиент для внешнего кольца -->
    <linearGradient id="goldRim" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#735118" />
      <stop offset="25%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#fff1b0" />
      <stop offset="75%" stop-color="#c59828" />
      <stop offset="100%" stop-color="#543809" />
    </linearGradient>

    <!-- Тонкий золотой штрих -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f" />
      <stop offset="50%" stop-color="#b88928" />
      <stop offset="100%" stop-color="#fcebbb" />
    </linearGradient>

    <!-- ПОЛУПРОЗРАЧНЫЙ ФОН: мягкое темное стекло, сквозь которое видна трава -->
    <radialGradient id="glassDisc" cx="80%" cy="80%" r="75%">
      <stop offset="0%" stop-color="#0a0e13" stop-opacity="0.65" />
      <stop offset="55%" stop-color="#080c10" stop-opacity="0.48" />
      <stop offset="85%" stop-color="#05080a" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#020304" stop-opacity="0.0" />
    </radialGradient>

    <!-- Свечение рун -->
    <filter id="runeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Полупрозрачная подложка диска (не глухая!) -->
  <circle cx="250" cy="250" r="244" fill="url(#glassDisc)" />

  <!-- 2. Внешний золотой обод -->
  <circle cx="250" cy="250" r="244" fill="none" stroke="url(#goldRim)" stroke-width="6" />
  <circle cx="250" cy="250" r="239" fill="none" stroke="#221706" stroke-width="1.8" />

  <!-- 3. Внутренняя золотая направляющая дуга (проходит строго за кнопками веера) -->
  <circle cx="250" cy="250" r="219" fill="none" stroke="url(#goldLight)" stroke-width="2.2" opacity="0.85" />
  <circle cx="250" cy="250" r="215" fill="none" stroke="#e8c86d" stroke-width="1.2" stroke-dasharray="3, 5" opacity="0.65" />

  <!-- 4. Руны вдоль обода (стилизованные символы Futhark / Elder Runes) -->
  <g fill="#ffd978" filter="url(#runeGlow)" opacity="0.9" font-family="'Cinzel', serif, monospace" font-size="19" font-weight="bold" text-anchor="middle">
    <text transform="translate(25.9, 310.0) rotate(-105.0)">ᚦ</text>
    <text transform="translate(18.0, 250.0) rotate(-90.0)">ᚱ</text>
    <text transform="translate(25.9, 190.0) rotate(-75.0)">ᚲ</text>
    <text transform="translate(49.1, 134.0) rotate(-60.0)">ᚷ</text>
    <text transform="translate(86.0, 86.0) rotate(-45.0)">ᚹ</text>
    <text transform="translate(134.0, 49.1) rotate(-30.0)">ᚺ</text>
    <text transform="translate(190.0, 25.9) rotate(-15.0)">ᚾ</text>
    <text transform="translate(250.0, 18.0) rotate(-0.0)">ᛁ</text>
    <text transform="translate(310.0, 25.9) rotate(15.0)">ᛃ</text>
    <text transform="translate(366.0, 49.1) rotate(30.0)">ᛇ</text>
    <text transform="translate(414.0, 86.0) rotate(45.0)">ᛈ</text>
    <text transform="translate(450.9, 134.0) rotate(60.0)">ᛉ</text>

    <!-- Декоративные золотые точки-разделители между рунами -->
    <circle cx="20.0" cy="280.3" r="2.5" fill="#ffeaa7" />
    <circle cx="35.7" cy="161.2" r="2.5" fill="#ffeaa7" />
    <circle cx="108.8" cy="65.9" r="2.5" fill="#ffeaa7" />
    <circle cx="219.7" cy="20.0" r="2.5" fill="#ffeaa7" />
    <circle cx="338.8" cy="35.7" r="2.5" fill="#ffeaa7" />
    <circle cx="434.1" cy="108.8" r="2.5" fill="#ffeaa7" />
  </g>
</svg>
