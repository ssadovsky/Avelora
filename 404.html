<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Avelora — Загрузка...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function() {
      var path = window.location.pathname;
      var search = window.location.search || '';
      var hash = window.location.hash || '';

      // Если запрос пришёл по старому адресу /Avelora/ (с заглавной буквы)
      if (/^\/Avelora(\/.*)?$/i.test(path)) {
        var newPath = path.replace(/^\/Avelora/i, '/avelora');
        window.location.replace(newPath + search + hash);
      } else {
        // Любой другой неизвестный путь направляем в корень игры
        window.location.replace('/avelora/' + search + hash);
      }
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=/avelora/">
  <style>
    body {
      background: #0c1214;
      color: #c9a048;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(201, 160, 72, 0.2);
      border-top-color: #c9a048;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    p {
      font-size: 16px;
      letter-spacing: 0.05em;
    }
    a {
      color: #7fd4ff;
      text-decoration: none;
      margin-top: 12px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Загрузка Avelora...</p>
  <a href="/avelora/">Нажмите сюда, если переход не произошёл автоматически</a>
</body>
</html>
